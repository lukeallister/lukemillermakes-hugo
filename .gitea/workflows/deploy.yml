name: deploy-blog
on:
  push:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: hugomods/hugo:exts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: build (drafts excluded)
        run: hugo --minify --buildDrafts=false --destination /tmp/hugo-check

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    container:
      image: node:18-alpine
      # Explicitly mount alma9's SSH (keyless to microos hermes) into the job container.
      # (The runner-level DOCKER_VOLUMES env is not honored by act_runner 0.6.1.)
      volumes:
        - /home/hermes/.ssh:/root/.ssh:ro
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: rsync into microos blog-content volume (hermes + sudo rsync)
        env:
          HOST: 192.168.1.126
          USER: hermes
          DEST: /home/hermes/.local/share/containers/storage/volumes/blog-content/_data
        run: |
          apk add --no-cache openssh-client rsync
          chmod 600 /root/.ssh/id_ed25519 2>/dev/null || true
          ssh -o StrictHostKeyChecking=accept-new "$USER@$HOST" "echo microos-reachable"
          # volume content/ is owned by uid 100999 (blog-hugo container); hermes cannot
          # write it directly, so the REMOTE rsync runs via passwordless sudo. Files are
          # chowned to hermes so no root-owned leftovers accumulate. No root SSH login.
          rsync -az --delete --rsync-path="sudo rsync" --chown=hermes:hermes \
                ./content/ "$USER@$HOST:$DEST/content/"
          rsync -az --rsync-path="sudo rsync" --chown=hermes:hermes \
                ./hugo.yaml ./archetypes ./layouts ./static ./assets \
                ./Dockerfile ./Dockerfile.hugo ./Dockerfile.scan ./nginx.conf ./docs ./scripts \
                "$USER@$HOST:$DEST/" 2>/dev/null || true
          echo "deploy -> $HOST done"
# valid_volumes fix
# valid_volumes doubled-prefix
