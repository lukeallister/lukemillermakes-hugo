# Minimal production nginx config for a Hugo static site.
# Drop-in for /etc/nginx/conf.d/default.conf in the nginx:alpine image.

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    # The Hugo build emits everything under /usr/share/nginx/html/.
    root  /usr/share/nginx/html;
    index index.html;

    # --- Logging ---
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log warn;

    # --- Pretty URLs (Hugo emits /foo/index.html for /foo/) ---
    # 1. Direct hit (e.g. /about/)           -> serve directory's index.html
    # 2. Direct file (e.g. /css/style.css)    -> serve the file
    # 3. Anything else                         -> fall back to /index.html
    #    (lets Hugo's 404 page handle unknown paths)
    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
    }

    # --- Long-lived caching for fingerprinted assets ---
    # Hugo fingerprints CSS/JS/images via Hugo Pipes / asset bundling.
    # Anything under /css/, /js/, or with a hash in its name is safe to
    # cache aggressively.
    location ~* \.(css|js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- No cache for HTML ---
    # Always revalidate index/single pages so any deploy shows up promptly.
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # --- Security headers ---
    # These are added to every response (including the static assets above).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # --- Compression ---
    # gzip is enabled at the http{} level in nginx.conf; we just make sure
    # common text types are covered. (The nginx:alpine default nginx.conf
    # already includes gzip on; this is belt-and-suspenders.)
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml;
    gzip_min_length 256;
}